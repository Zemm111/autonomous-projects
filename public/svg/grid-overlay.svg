<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <!-- Deconstructed asymmetric grid -->
  <!-- Vertical lines at irregular intervals -->
  <line x1="120" y1="0" x2="120" y2="800" stroke="#000" stroke-width="0.5" opacity="0.12"/>
  <line x1="440" y1="0" x2="440" y2="800" stroke="#000" stroke-width="0.5" opacity="0.12"/>
  <line x1="460" y1="0" x2="460" y2="800" stroke="#000" stroke-width="0.5" opacity="0.08"/>
  <line x1="780" y1="0" x2="780" y2="800" stroke="#000" stroke-width="0.5" opacity="0.12"/>
  <line x1="1080" y1="0" x2="1080" y2="800" stroke="#000" stroke-width="0.5" opacity="0.12"/>
  <!-- Horizontal lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#000" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#000" stroke-width="0.5" opacity="0.08"/>
  <!-- Diagonal disruption -->
  <line x1="440" y1="200" x2="780" y2="520" stroke="#000" stroke-width="0.5" opacity="0.06"/>
  <!-- Small grid fragment (top-right) -->
  <rect x="900" y="40" width="160" height="120" stroke="#000" stroke-width="0.5" opacity="0.06" fill="none"/>
  <line x1="980" y1="40" x2="980" y2="160" stroke="#000" stroke-width="0.5" opacity="0.06"/>
  <line x1="900" y1="100" x2="1060" y2="100" stroke="#000" stroke-width="0.5" opacity="0.06"/>
</svg>
